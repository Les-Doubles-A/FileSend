[package]
name = "filesend-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
tempfile = "3"
