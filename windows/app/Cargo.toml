[package]
name = "filesend-app"
version = "0.2.0"
edition = "2021"

[dependencies]
filesend-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"
rfd = "0.15"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }
